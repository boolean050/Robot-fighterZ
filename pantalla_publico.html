<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="portal_jueces_backend.js"></script>

    <title>Guerra de Robots - Panel Oficial FIME</title>

    <!--------------------------------------------------------------------------->
    
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen p-8 flex flex-col justify-between">

    <header class="relative text-center mb-10 pt-4">
        
        <div class="absolute top-0 left-0 hidden md:block">
            <img src="/static/images/logofime.gif" 
                alt="Logo UANL" 
                class="h-20 w-auto object-contain opacity-90">
        </div>

        <div class="absolute top-0 right-0 hidden md:block">
            <img src="/static/images/osofime.svg" 
                alt="Logo FIME" 
                class="h-20 w-auto object-contain opacity-90">
        </div>
    
        <h1 class="text-3xl md:text-5xl font-extrabold text-emerald-800 tracking-wider uppercase drop-shadow-sm md:px-24">
            Guerra de Robots FIME
        </h1>
        <p class="text-emerald-900 text-sm md:text-lg font-bold tracking-wide mt-2">
            Fase Inicial: Registro e Inscripción de Jueces
        </p>
        <div class="h-1.5 w-32 bg-emerald-800 mx-auto mt-4 rounded-full"></div>
    </header>

    <main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 max-w-7xl mx-auto w-full items-start mb-auto">
        
        <div class="bg-white border-2 border-gray-100 rounded-2xl p-5 shadow-lg min-h-[250px] transition-all hover:border-emerald-800/30">
            <h3 class="text-base font-extrabold text-emerald-800 text-center uppercase tracking-wider border-b-2 border-gray-100 pb-3 mb-4">Pequeños</h3>
            <div id="lista-pequeños" class="space-y-3"></div>
        </div>

        <div class="bg-white border-2 border-gray-100 rounded-2xl p-5 shadow-lg min-h-[250px] transition-all hover:border-emerald-800/30">
            <h3 class="text-base font-extrabold text-emerald-800 text-center uppercase tracking-wider border-b-2 border-gray-100 pb-3 mb-4">Mediano</h3>
            <div id="lista-mediano" class="space-y-3"></div>
        </div>

        <div class="bg-white border-2 border-gray-100 rounded-2xl p-5 shadow-lg min-h-[250px] transition-all hover:border-emerald-800/30">
            <h3 class="text-base font-extrabold text-emerald-800 text-center uppercase tracking-wider border-b-2 border-gray-100 pb-3 mb-4">Grandes</h3>
            <div id="lista-grandes" class="space-y-3"></div>
        </div>

        <div class="bg-white border-2 border-gray-100 rounded-2xl p-5 shadow-lg min-h-[250px] transition-all hover:border-emerald-800/30">
            <h3 class="text-base font-extrabold text-emerald-800 text-center uppercase tracking-wider border-b-2 border-gray-100 pb-3 mb-4">Seg. Línea</h3>
            <div id="lista-seguimiento-de-línea" class="space-y-3"></div>
        </div>

        <div class="bg-white border-2 border-gray-100 rounded-2xl p-5 shadow-lg min-h-[250px] transition-all hover:border-emerald-800/30">
            <h3 class="text-base font-extrabold text-emerald-800 text-center uppercase tracking-wider border-b-2 border-gray-100 pb-3 mb-4">Evasor Obs.</h3>
            <div id="lista-evasor-de-obstáculos" class="space-y-3"></div>
        </div>

    </main>

    <footer class="mt-12 text-center text-xs font-bold text-emerald-900 border-t border-gray-200 pt-4 uppercase tracking-wider">
        FACULTAD DE INGENIERÍA MECÁNICA Y ELÉCTRICA • UANL
    </footer>

    
</body>
</html>
